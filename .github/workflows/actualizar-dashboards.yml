name: Actualizar dashboards

on:
  schedule:
    # Se ejecuta cada 4 horas en UTC
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-dashboards
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Generar dashboards y enviar alertas
        env:
          TELEGRAM_TOKEN: "8901055148:AAHea7F6UjSJ8jSnpluKyAsQHoOAxwjb25k"
          TELEGRAM_CHAT_ID: "-1001003933641105"
        run: python main.py --once

      - name: Publicar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html rachas.html state.json cache_eventos.json
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "chore: actualizar dashboards y estado"
            git push
          fi